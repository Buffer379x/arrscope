services:
  scopearr:
    image: ghcr.io/buffer379x/scopearr:${SCOPEARR_TAG:-${ARRSCOPE_TAG:-stable}}
    container_name: scopearr
    restart: unless-stopped
    user: "${SCOPEARR_UID:-${ARRSCOPE_UID:-99}}:${SCOPEARR_GID:-${ARRSCOPE_GID:-100}}"
    ports:
      - "${SCOPEARR_BIND:-${ARRSCOPE_BIND:-0.0.0.0}}:${SCOPEARR_PORT:-${ARRSCOPE_PORT:-8080}}:8080"
    environment:
      SCOPEARR_DATA_DIR: /data
      SCOPEARR_HTTPS: "${SCOPEARR_HTTPS:-${ARRSCOPE_HTTPS:-false}}"
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: "2"
    volumes:
      - "${SCOPEARR_APPDATA:-${ARRSCOPE_APPDATA:-./appdata}}:/data"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/Buffer379x/scopearr/main/web/public/icon-256.png"
