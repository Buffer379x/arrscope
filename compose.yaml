services:
  arrscope:
    image: ghcr.io/buffer379x/arrscope:${ARRSCOPE_TAG:-stable}
    container_name: arrscope
    restart: unless-stopped
    user: "${ARRSCOPE_UID:-99}:${ARRSCOPE_GID:-100}"
    ports:
      - "${ARRSCOPE_BIND:-0.0.0.0}:${ARRSCOPE_PORT:-8080}:8080"
    environment:
      ARRSCOPE_DATA_DIR: /data
      ARRSCOPE_HTTPS: "${ARRSCOPE_HTTPS:-false}"
      GOMEMLIMIT: 96MiB
      GOMAXPROCS: "2"
    volumes:
      - "${ARRSCOPE_APPDATA:-./appdata}:/data"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/Buffer379x/arrscope/main/web/public/icon-256.png"
